<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>ASI FPB Mains Trainer Hosted v7</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">FP</div>
        <div><strong>ASI FPB</strong><span>Mains Trainer</span></div>
      </div>
      <nav id="nav">
        <button class="nav-btn active" data-view="dashboard">🏠 Dashboard</button>
        <button class="nav-btn" data-view="learn">🧭 Learn & Shortcuts</button>
        <button class="nav-btn" data-view="strategy">🧠 Exam Strategy</button>
        <button class="nav-btn" data-view="syllabus">📚 Syllabus</button>
        <button class="nav-btn" data-view="practice">🎯 Practice</button>
        <button class="nav-btn" data-view="tests">⏱️ Tests & Mocks</button>
        <button class="nav-btn" data-view="mistakes">🧠 Mistake Book</button>
        <button class="nav-btn" data-view="alerts">🔔 Press Notes</button>
        <button class="nav-btn" data-view="settings">⚙️ Data & Settings</button>
      </nav>
      <div class="sidebar-note">
        <strong>Mastery rule</strong>
        <span>≥80% topic test + retention review</span>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Train by mastery, not by chapter completion.</p>
        </div>
        <div class="top-actions"><button id="quickPractice" class="primary">Start 10 Questions</button></div>
      </header>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-learn" class="view"></section>
      <section id="view-strategy" class="view"></section>
      <section id="view-syllabus" class="view"></section>
      <section id="view-practice" class="view"></section>
      <section id="view-tests" class="view"></section>
      <section id="view-mistakes" class="view"></section>
      <section id="view-alerts" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
