num_system:['Integers, factors, multiples, divisibility, HCF/LCM and remainders.','For two numbers: product = HCF × LCM. Use modular cycles instead of expanding powers.','Do not confuse factor with multiple; check whether the question asks least or greatest.','Target 30–50 sec.'],
simple_interest:['SI = PRT/100; Amount = P + SI.','Convert time to years first. For repeated equal-rate periods, calculate one-year interest mentally.','Interest may be on selling price, loan balance or principal — identify the base.','30–45 sec.'],
compound_interest:['Amount = P(1+r/100)^n; CI = A−P.','For 2 years: CI−SI = P(r/100)^2.','Do not use SI when compounding is stated.','40–70 sec.'],
ratio:['Reduce ratios; divide quantity by total parts; direct/inverse proportion.','If a:b=m:n, set a=mk,b=nk immediately.','Keep units identical before forming a ratio.','30–50 sec.'],
average:['Average = sum/count; combined average uses weighted totals.','For consecutive equally spaced values, middle value = average.','Do not average two averages unless group sizes are equal.','25–45 sec.'],
percentage:['x% = x/100; percentage change and successive change.','Useful: 12.5%=1/8, 16⅔%=1/6, 20%=1/5, 25%=1/4, 33⅓%=1/3, 50%=1/2.','+20% then −20% is not zero net change; it is −4%.','25–45 sec.'],
profit_loss:['Profit%=profit/CP; discount%=discount/MP.','Use CP=100 or MP=100 when only percentages matter.','Profit is normally on cost price unless explicitly stated otherwise.','35–60 sec.'],
time_work:['Work = rate×time; rate for n days =1/n.','Use LCM of days as total work to avoid fractions.','Adding workers means adding rates, not subtracting days.','45–75 sec.'],
work_wages:['Wages divide in proportion to work done; work ∝ efficiency×time.','Build a work ratio first, then split money.','Equal time does not imply equal wages if efficiencies differ.','40–60 sec.'],
time_distance:['D=ST; relative speed for same/opposite direction.','km/h to m/s ×5/18; m/s to km/h ×18/5.','Average speed is not simple mean unless times are equal.','35–60 sec.'],
clocks_calendars:['Day cycles repeat every 7; clock-angle basics.','Reduce day counts mod 7 before moving weekdays.','Leap-year century rule: divisible by 400, not merely 100.','35–60 sec.'],
partnership:['Profit share ∝ capital×time.','Create capital-month values and reduce ratio.','Do not divide by capital alone when joining times differ.','40–60 sec.'],
mensuration:['Know area, perimeter, surface area and volume formulas.','Write the requested dimension/formula before inserting values.','Keep square/cubic units consistent.','35–60 sec.'],
analogy:['Find the exact relation in the first pair and transfer it.','Check category, function, degree, letter value or number rule.','Do not accept a vague similarity when a stronger relation exists.','20–35 sec.'],
similarity:['Classify by common property and detect the odd member.','State one defining property before choosing.','Avoid surface appearance if structural relation is stronger.','20–35 sec.'],
spatial_visual:['Cubes, folds, rotations and visual transformations.','For painted cubes with n pieces/edge: unpainted=(n−2)^3; exactly one face=6(n−2)^2.','Count edges/faces carefully; sketch when uncertain.','40–75 sec.'],
spatial_orientation:['Directions, turns and displacement.','Use x-y coordinates: east +x, north +y.','Left/right depends on current facing direction.','30–50 sec.'],
problem_solving:['Ranking, ordering, constraints and structured puzzles.','Translate words into positions/equations before testing options.','Do not carry an unstated assumption.','40–75 sec.'],
analysis_judgment:['Statements, conclusions, assumptions and data sufficiency.','Ask “must this follow?” not “can this be true?”.','Converse and inverse are common traps.','35–60 sec.'],
decision_making:['Select conclusions/actions justified by given facts.','Reject options needing facts not supplied.','Practical sounding is not the same as logically supported.','30–50 sec.'],
visual_memory:['Recall positions, patterns and changes.','Chunk visual information into groups.','Avoid rereading one area at expense of whole pattern.','20–40 sec.'],
observation:['Detect detail, mismatch, sequence or hidden relation.','Scan systematically rather than randomly.','Watch tiny symbol/orientation changes.','20–35 sec.'],
relationship:['Family/blood relations and relational mapping.','Draw generations vertically and genders explicitly.','Words like maternal/paternal change the tree.','30–50 sec.'],
verbal_figural:['Classification by shared verbal or figure property.','Find the property shared by three options.','Do not overfit a complicated rule.','20–35 sec.'],
series:['Number/letter sequences.','Check differences, second differences, ratios, alternating terms.','Do not force one rule before testing alternation.','25–45 sec.'],
nonverbal_series:['Figure progression, rotation, count and shading.','Track one feature at a time: rotation → count → fill → position.','Multiple simultaneous changes are common.','25–45 sec.'],
coding_decoding:['Letter positions, substitutions and transformations.','Write A=1…Z=26; test forward/backward shifts.','Verify rule on every letter/word, not just first two.','25–45 sec.'],
syllogism:['Set relations and conclusion testing.','Use small Venn diagrams; judge only necessary conclusions.','Existence cannot be assumed from universal statements unless given.','35–55 sec.'],
computer_basics:['CPU, ALU, CU, registers, buses, instruction cycle and I/O basics.','Remember hierarchy: registers → cache → RAM → secondary storage.','Clock speed alone does not define total performance.','20–40 sec.'],
memory:['RAM/ROM/cache, HDD/SSD, optical and storage units.','Volatile: RAM; non-volatile: ROM/flash/storage.','Cache is not secondary storage.','15–30 sec.'],
raid:['RAID concepts: striping, mirroring, parity and fault tolerance.','RAID 0=striping/no redundancy; RAID 1=mirror; RAID 5=distributed parity.','RAID is not a backup.','20–35 sec.'],
peripherals:['Input/output/storage devices and interfaces.','Classify device by primary function.','Touchscreen is both input and output.','15–30 sec.'],
operating_systems:['Processes, memory, file systems, users, permissions and Windows tools.','Process ≠ program; virtual memory extends addressable memory using storage.','Do not confuse multitasking with multiprocessing.','20–40 sec.'],
dbms:['Tables, keys, normalization, SQL, transactions, concurrency and recovery.','Primary key uniquely identifies; foreign key references another table. ACID: atomicity, consistency, isolation, durability.','WHERE filters rows; HAVING filters groups.','25–50 sec.'],
word:['Formatting, styles, tables, mail merge, page setup and review tools.','Ctrl+B bold, Ctrl+I italic, Ctrl+U underline; styles beat manual formatting for consistency.','Header/footer differs from margin.','15–30 sec.'],

eng_mcq:['Grammar, vocabulary, comprehension and usage under negative marking.','With −25% penalty per wrong answer, break-even probability is 20%; eliminate options before guessing.','Do not make multiple OMR marks; one such response is treated wrong.','Aim 40–50 sec/question with a final review buffer.'],
eng_desc:['Précis, essay, letter/report, paragraph and comprehension writing.','Plan 10% of time, write 80%, reserve 10% to edit.','Do not exceed word limits or skip format requirements.','Use section-specific timed practice.']

var advancedTips={
eng_mcq:{tricks:['Use option elimination before solving from scratch.','For vocabulary/context questions, substitute each option into the sentence and read the full meaning.','In grammar questions, first locate subject–verb, tense, article/preposition and pronoun agreement.'],master:'Build an error log by grammar rule, not just by question. If three errors come from subject–verb agreement, revise that rule immediately.',pro:'Because Part-A carries a wrong-answer penalty, do not spend long on a doubtful item. First collect sure marks, then return to questions where you can eliminate options.'},
eng_desc:{tricks:['Spend the first 10% of time making a skeleton: opening, 2–4 core points, conclusion.','For précis, preserve the author’s logic but remove examples/repetition.','For letters/reports, memorise the format so exam time goes into content, not layout.'],master:'Practise writing to a fixed word limit with a timer. Quality drops sharply when the last paragraph is rushed.',pro:'Reserve the final few minutes for spelling, punctuation, paragraph breaks and unanswered sub-parts. Presentation can protect marks you already earned.'},
num_system:{tricks:['Use divisibility tests before long division.','For last-digit questions, use repeating cycles of powers.','For two positive integers: HCF × LCM = product of the numbers.','Reduce large remainder problems modulo the divisor at every step.'],master:'Train yourself to recognize whether the question is really about factors, multiples, remainders or digit cycles before calculating.',pro:'If options are far apart, estimate/divisibility-test them instead of fully calculating. Skip long arithmetic on pass 1 if no short structure appears within 15–20 seconds.'},
simple_interest:{tricks:['Think “1% of principal” first, then multiply by rate × time.','SI scales linearly with principal, rate and time.','If amount is asked: A=P(1+RT/100).'],master:'Convert months/days into years before touching the formula; many avoidable errors come from time units.',pro:'For percentage-only comparison questions, assume a convenient principal such as 100 or 1000 and remove unnecessary algebra.'},
compound_interest:{tricks:['Use growth factors: +r% means ×(1+r/100).','For 2 years at the same rate: CI−SI = P(r/100)^2.','Successive percentage changes multiply; do not simply add them.'],master:'Memorise common squares such as 1.1²=1.21, 1.2²=1.44, 1.25²=1.5625 for quick two-year calculations.',pro:'When options differ widely, calculate the growth factor first and approximate before doing exact multiplication.'},
ratio:{tricks:['Convert a:b into ak:bk immediately.','For division in ratio a:b, shares are Total×a/(a+b) and Total×b/(a+b).','Match common terms before combining two ratios.','Inverse proportion: product stays constant.'],master:'Normalize units before forming a ratio. Minutes vs hours or rupees vs paise can silently destroy an otherwise correct method.',pro:'If the ratio question becomes equation-heavy, test answer options backward; it is often faster than solving for every variable.'},
average:{tricks:['Average × count = total.','For equally spaced consecutive values, the middle value is the average.','Replacement shortcut: new average = old average +(new−old)/n.','Use assumed mean/deviations for long data sets.'],master:'For combined averages, always rebuild totals; never average two averages unless group sizes are equal.',pro:'If one value is unknown, work with total-sum balance instead of adding every known number repeatedly.'},
percentage:{tricks:['Memorise 1/2=50%, 1/3=33⅓%, 1/4=25%, 1/5=20%, 1/6=16⅔%, 1/8=12.5%, 1/10=10%.','x% of y = y% of x.','Successive changes a% and b% give net a+b+ab/100, using signs.','For reverse percentages, divide by the multiplier rather than subtracting the percentage.'],master:'Learn to see percentages as fractions and multipliers; this removes most arithmetic.',pro:'When a question contains awkward values like 12.5%, 16⅔% or 33⅓%, convert to fractions immediately instead of decimal multiplication.'},
profit_loss:{tricks:['When only percentages matter, take CP=100.','SP=CP×(100±profit/loss%)/100.','After discount, SP=MP×(100−d)/100.','Successive discounts multiply; they do not add.'],master:'Separate the three bases—CP, SP and MP. Most traps are created by using the right percentage on the wrong base.',pro:'For marked-price + discount + profit chains, use multipliers from left to right; avoid calculating rupees until the final step.'},
time_work:{tricks:['Take LCM of individual days as total work.','Efficiency is inverse to time for equal work.','Combined rate = sum of individual rates.','If A is x% more efficient than B, time ratio is inverse of efficiency ratio.'],master:'Write work units per day beside each person before forming equations. This prevents rate/time inversion.',pro:'If a worker joins or leaves midway, split the problem into phases and track remaining work—not remaining days.'},
work_wages:{tricks:['Wage share ∝ work done.','Work ∝ efficiency × time.','If time is equal, wage ratio = efficiency ratio.'],master:'Build one compact table: person | efficiency | time | work. Then divide wages by work ratio.',pro:'Do not calculate actual work if ratios are enough; cancel common time/efficiency factors early.'},
time_distance:{tricks:['D=ST.','km/h→m/s multiply 5/18; m/s→km/h multiply 18/5.','Opposite directions: relative speed adds; same direction: subtracts.','Equal-distance average speed = 2xy/(x+y).'],master:'Decide first whether the question is ordinary motion, relative motion, train-length or average-speed; each has a different shortest route.',pro:'Use ratios when distances are common. If two travellers cover the same distance, time ratio is inverse of speed ratio.'},
clocks_calendars:{tricks:['Clock angle = |30H−5.5M|, then take the smaller angle if asked.','Weekday shifts depend on total days mod 7.','Ordinary year contributes 1 odd day; leap year contributes 2.','Century leap rule: divisible by 400.'],master:'For calendar questions, reduce years/months to odd days instead of counting every day.',pro:'If the date is historical and arithmetic becomes long, use the nearest known/reference date and move by modulo 7.'},
partnership:{tricks:['Profit ratio = capital × time.','Convert every investment period to the same unit, usually months.','If capital changes midway, split into capital-month blocks.'],master:'Never compare capital alone unless everyone invested for identical time.',pro:'Cancel common month factors and zeros before multiplying large numbers.'},
mensuration:{tricks:['Memorise core 2D area/perimeter and 3D surface/volume formulas.','If every length scales by k, area scales by k² and volume by k³.','For paths/borders, use outer area − inner area.'],master:'Write the dimension and units next to the requested quantity before substitution: length, area or volume.',pro:'Use π=22/7 when dimensions contain multiples of 7 and options suggest an exact value; otherwise keep π symbolic until late.'},
analogy:{tricks:['State the relationship in words before looking at options.','Check function, part–whole, cause–effect, degree, category, synonym/antonym, number/letter rule.','For alphabet analogies, use A=1…Z=26 only after semantic relations fail.'],master:'A precise relation beats a vague similarity. “Bird:nest = bee:hive” is stronger than “both are animals/insects”.',pro:'Eliminate options that match only one side of the relationship; the correct option must preserve direction as well as relation.'},
similarity:{tricks:['Find one property shared by three items and missing in one.','Check category, function, structure, spelling pattern, numerical property.','Prefer the simplest rule explaining all three.'],master:'Do not invent a complex property to justify your first impression; test every candidate against all options.',pro:'On pass 1, if two plausible classifications remain after 30 seconds, mark and move—these questions can consume time disproportionally.'},
spatial_visual:{tricks:['For an n×n×n cube painted on all faces: unpainted=(n−2)^3; exactly one face=6(n−2)^2; exactly two faces=12(n−2); three faces=8.','Track rotations by fixing one reference face/edge.','For paper folding, unfold in reverse order.'],master:'Separate position, orientation and count. Solving all three mentally at once causes errors.',pro:'Sketch a tiny cube/net when needed; a 10-second sketch is faster than repeated mental rotation.'},
spatial_orientation:{tricks:['Use coordinates: east +x, west −x, north +y, south −y.','After every turn, update facing direction before moving.','Final straight-line distance comes from Pythagoras when x/y displacement is known.'],master:'Draw only turning points, not a decorative map. Keep the diagram minimal.',pro:'If options are directional only, determine quadrant first; calculate exact distance only if necessary.'},
problem_solving:{tricks:['Convert verbal constraints into symbols, a table or ordered slots.','Use the most restrictive condition first.','Test options when direct construction is long.'],master:'Separate facts from assumptions. Competitive reasoning questions often punish “common sense” information not stated.',pro:'For arrangement puzzles, create a base diagram once and reuse it across linked questions instead of rebuilding.'},
analysis_judgment:{tricks:['For conclusions, ask “must it follow?” not “could it happen?”.','For assumptions, identify what must be taken for granted for the statement/action to make sense.','For data sufficiency, stop as soon as uniqueness can be established.'],master:'Never reverse an implication: A→B does not mean B→A.',pro:'In data sufficiency, do not waste time finding the actual numerical answer when you only need to know whether it can be determined.'},
decision_making:{tricks:['Choose actions supported by the stated facts and objective.','Reject options depending on missing facts.','Prefer direct, proportionate action over extreme/unrelated action.'],master:'Separate what is desirable in real life from what follows from the information supplied.',pro:'If two answers look sensible, identify which one addresses the stated problem with fewer unsupported assumptions.'},
visual_memory:{tricks:['Chunk items into 3–5 groups.','Encode relative positions such as top-left, centre, bottom-right.','Notice distinctive anchors first.'],master:'Recall the structure before individual details; location memory is stronger when attached to a grid.',pro:'Do not stare at one unusual symbol too long. Scan the whole figure once, then revisit anomalies.'},
observation:{tricks:['Scan left-to-right/top-to-bottom consistently.','Compare one feature at a time: count, direction, size, shade, position.','Use edge/corner anchors in dense figures.'],master:'Systematic scanning beats fast random looking; speed comes from a fixed scan order.',pro:'When options differ in only one micro-feature, stop comparing everything else and isolate that feature.'},
relationship:{tricks:['Draw generations vertically and same generation horizontally.','Mark gender immediately.','Translate maternal/paternal before tracing the relation.'],master:'Work from the named reference person outward; do not mentally jump between viewpoints.',pro:'If asked “X is how related to Y”, trace from Y to X at the end to avoid reversing the answer.'},
verbal_figural:{tricks:['Build an attribute checklist: category, count, direction, fill, symmetry, position.','Find the property common to three options.','For verbal classification, check meaning before spelling.'],master:'A classification rule must cleanly separate one option; avoid rules with exceptions.',pro:'Test the simplest high-signal attributes first—count and direction usually beat decorative details.'},
series:{tricks:['Check first difference, second difference, multiplication/division, squares/cubes, primes and alternating subsequences.','For letters, convert positions only when the visual shift is not obvious.','Split odd and even positions if a single rule fails.'],master:'Look at the size of jumps: steadily increasing differences often indicate second-difference patterns.',pro:'Do not spend a minute forcing a formula. If two clean patterns fail, test options forward/backward and move on.'},
nonverbal_series:{tricks:['Track rotation, movement, count, shading and shape change independently.','Odd/even frames may form two interleaved patterns.','Count additions/removals before studying orientation.'],master:'Write a tiny note such as “+90°, +1 dot” rather than holding the whole pattern in working memory.',pro:'If one feature already eliminates three options, stop analyzing other features.'},
coding_decoding:{tricks:['A=1…Z=26 and reverse position = 27−n.','Check constant shifts, alternating shifts, reversal and pair swapping.','For word values, test sum/product/difference of letter positions only if simple substitution fails.'],master:'Verify the discovered rule on every character of the example, not just the first one.',pro:'Use answer options to infer the coding rule when the example is ambiguous; options often reveal the intended transformation.'},
syllogism:{tricks:['Use minimal Venn diagrams.','“All A are B” places A inside B; it does not imply all B are A.','“Some” establishes existence; universal statements alone may not.','Test each conclusion independently.'],master:'Judge only logical necessity. Real-world truth is irrelevant if not encoded in the statements.',pro:'For two close conclusions, try to draw a valid counterexample. If a counterexample is possible, that conclusion does not necessarily follow.'},
computer_basics:{tricks:['Remember CPU core roles: ALU=arithmetic/logic, CU=control, registers=fast working storage.','Memory hierarchy: registers → cache → RAM → secondary storage.','Separate data bus, address bus and control bus by what they carry.'],master:'Learn components by function and hierarchy, not isolated definitions; this handles twisted wording better.',pro:'In factual MCQs, eliminate by category first. A storage device cannot suddenly be a CPU control component just because the term sounds technical.'},
memory:{tricks:['Volatile: RAM/cache/registers; non-volatile: ROM/flash/SSD/HDD.','Faster memory is usually smaller and more expensive per bit.','Know bit, byte and common binary-size relationships.'],master:'Distinguish primary memory, cache and secondary storage by CPU access, volatility and purpose.',pro:'Watch wording such as “typically”, “main memory” and “permanent”; choose the textbook definition expected by the syllabus.'},
raid:{tricks:['RAID 0=striping/no redundancy; RAID 1=mirroring; RAID 5=striping + distributed single parity; RAID 6=dual parity; RAID 10=mirror + stripe.','Minimum drives: RAID0=2, RAID1=2, RAID5=3, RAID6=4.'],master:'Learn each level as performance + redundancy + capacity trade-off, not just a number.',pro:'If an option calls RAID a backup, be suspicious: RAID improves availability/fault tolerance but does not replace an independent backup.'},
peripherals:{tricks:['Classify devices as input, output, storage or mixed.','Touchscreen is both input and output.','Scanner captures; printer produces hard copy.'],master:'Link each peripheral to data direction relative to the computer.',pro:'When two devices look similar, ask what signal/data enters or leaves the system rather than memorising examples.'},
operating_systems:{tricks:['Program=passive code; process=program in execution; thread=execution unit within a process.','Virtual memory uses secondary storage to extend the memory abstraction.','Kernel manages core resources; shell/UI provides interaction.'],master:'Organize OS questions into process, memory, file, device, security and user-management categories.',pro:'For Windows-tool questions, focus on purpose first; exact UI locations can vary by version, but the underlying function is stable.'},
dbms:{tricks:['Primary key uniquely identifies; foreign key references; candidate key is a minimal unique candidate.','ACID: Atomicity, Consistency, Isolation, Durability.','WHERE filters rows; HAVING filters groups.','Normalization: remove redundancy/dependency step by step.'],master:'For SQL, mentally follow FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY to reason about results.',pro:'When an SQL question is long, identify the asked output column and filtering/grouping clauses first; ignore irrelevant table details.'},
word:{tricks:['Ctrl+B bold, Ctrl+I italic, Ctrl+U underline, Ctrl+F find, Ctrl+H replace.','Styles provide consistent formatting; headers/footers repeat page elements; Mail Merge personalizes bulk documents.'],master:'Learn Word features by task: editing, formatting, references, review, page layout, mail merge.',pro:'Shortcut questions are easy marks only if automatic. Drill a small high-frequency set rather than memorising dozens of obscure keys.'},
excel:{tricks:['$A$1 locks row+column; A$1 locks row; $A1 locks column.','SUM adds, AVERAGE averages, COUNT counts numeric cells, COUNTA counts non-empty cells.','Use IF for conditional output; sort reorders, filter hides non-matching rows.'],master:'Before evaluating a formula, inspect references and operator precedence. Many exam traps are reference mistakes, not arithmetic.',pro:'For copied-formula questions, move the reference exactly as Excel would; do not recalculate the whole sheet.'},
powerpoint:{tricks:['F5 starts slideshow from beginning; Shift+F5 starts from current slide.','Transition=between slides; animation=objects on a slide.','Slide Master controls repeated design/layout elements.'],master:'Learn presentation features by scope: whole presentation, slide, or object.',pro:'When options contain both transition and animation, ask “does this act on the slide change or an object?”—that usually resolves it instantly.'},
access:{tricks:['Table stores data; Query retrieves/transforms; Form is user-facing input/display; Report presents/prints.','Primary/foreign keys create relational links.'],master:'Map every Access object to its job instead of memorising menus.',pro:'If asked how to obtain a subset/calculation without permanently duplicating data, “Query” is usually the concept to examine first.'},
networking:{tricks:['OSI layers bottom→top: Physical, Data Link, Network, Transport, Session, Presentation, Application.','Switch mainly forwards frames inside a LAN; router forwards packets between networks.','Common ports: HTTP 80, HTTPS 443, DNS 53, SMTP 25.','DNS resolves names; DHCP supplies network configuration.'],master:'Answer by layer/function: MAC→Data Link, IP/router→Network, TCP/UDP→Transport, HTTP/DNS→Application.',pro:'If you forget a device, ask what boundary it crosses: same LAN tends toward switching; different IP networks require routing.'},
security:{tricks:['CIA triad: Confidentiality, Integrity, Availability.','Authentication=identity; authorization=permissions.','Hashing is one-way; encryption is reversible with the proper key.','Firewall filters network traffic; antivirus targets malicious software.'],master:'Classify every security control by goal: prevent, detect, authenticate, authorize, encrypt, recover.',pro:'Beware absolute claims such as “antivirus prevents all malware” or “encryption guarantees integrity”; security controls solve specific problems, not everything.'}
};

function begin(qs,timed,topic){session={qs:qs,i:0,score:0,answered:false,timed:timed,topic:topic,seconds:timed?Math.round(qs.length*54):0};nav('practice');question();if(timer)clearInterval(timer);if(timed)timer=setInterval(function(){session.seconds--;tick();if(session.seconds<=0)finish()},1000)}
function question(){var q=session.qs[session.i],src=q.src==='PYQ'?'<span class="badge pyq">2023 PYQ-derived</span>':'<span class="badge model">Model</span>',meta=q.src==='PYQ'?'<div class="source"><b>2023 · Booklet '+q.meta.booklet+' · original Q'+q.meta.qno+'</b><br>'+q.meta.wording+' · <a target="_blank" href="'+q.meta.url+'">source ↗</a></div>':'';document.getElementById('practice').innerHTML='<div class="card"><div class="row spread"><span class="badge">'+q.paper+' · '+TN[q.topic]+'</span><span>'+(session.i+1)+'/'+session.qs.length+' <b id="tm"></b></span></div><div class="progress"><i style="width:'+(session.i/session.qs.length*100)+'%"></i></div><div class="row" style="margin-top:14px">'+src+'</div>'+meta+'<div class="q">'+q.text+'</div><div id="opts">'+q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>'}).join('')+'</div><div id="fb"></div><div class="row spread" style="margin-top:12px"><button class="btn" onclick="finish()">End</button><button id="nx" class="btn primary hidden" onclick="next()">Next</button></div></div>';tick()}
window.answer=function(i){if(session.answered)return;session.answered=true;var q=session.qs[session.i],ok=i===q.ans;if(ok)session.score++;state.attempted++;if(ok)state.correct++;state.history.push({id:q.id,topic:q.topic,correct:ok,ts:Date.now()});if(!ok){var m=state.mistakes[q.id]||{count:0};m.count++;m.last=Date.now();state.mistakes[q.id]=m}else if(state.mistakes[q.id]&&state.mistakes[q.id].count<=1)delete state.mistakes[q.id];save();document.querySelectorAll('.opt').forEach(function(b){var x=+b.dataset.i;b.disabled=true;if(x===q.ans)b.classList.add('correct');if(x===i&&!ok)b.classList.add('wrong')});var f=document.getElementById('fb');f.className='feedback';f.innerHTML='<b>'+(ok?'Correct.':'Incorrect.')+'</b> '+q.why;document.getElementById('nx').classList.remove('hidden')}
window.next=function(){if(session.i+1>=session.qs.length)finish();else{session.i++;question()}}
function tick(){var e=document.getElementById('tm');if(e&&session&&session.timed){var s=session.seconds;e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}
window.finish=finish;function finish(){if(!session)return;if(timer)clearInterval(timer);var sc=Math.round(session.score*100/session.qs.length);if(session.topic)state.topicBest[session.topic]=Math.max(state.topicBest[session.topic]||0,sc);save();document.getElementById('practice').innerHTML='<div class="card"><h2>Session complete</h2><div class="big">'+sc+'%</div><p>'+session.score+' / '+session.qs.length+' correct.</p><p class="mut">'+(sc>=80?'Strong. Retest later to prove retention.':sc>=60?'Review errors before moving on.':'Return to the learning module, then retry a shorter drill.')+'</p><div class="row"><button class="btn primary" onclick="nav(\'dashboard\')">Dashboard</button><button class="btn" onclick="nav(\'mistakes\')">Mistakes</button></div></div>';session=null}
function uniqueMixed(){var seen={};return bank.filter(function(q){if(q.paper!=='P2'&&q.paper!=='P3')return false;var k=q.paper+'|'+q.topic+'|'+q.text;if(seen[k])return false;seen[k]=1;return true})}
function exams(){var mix=uniqueMixed();document.getElementById('exams').innerHTML='<div class="card"><h2>Exam ladder</h2><p class="mut">Do cumulative testing before syllabus completion. Full strict 200-question simulation unlocks only after 200 genuinely distinct question texts are loaded.</p></div><div class="grid"><div class="card"><h3>20Q topic/mixed sprint</h3><p>Short accuracy + pace check.</p><button class="btn primary" onclick="mixed(20)">Start</button></div><div class="card"><h3>50Q cumulative</h3><p>Mixed Paper II + III.</p><button class="btn primary" onclick="mixed(50)">Start</button></div><div class="card"><h3>100Q cumulative</h3><p>Timed at 54 sec/question.</p><button class="btn primary" '+(mix.length<100?'disabled':'')+' onclick="mixed(100)">Start</button></div><div class="card"><h3>200Q strict mock</h3><p>'+mix.length+' genuinely distinct question texts currently loaded.</p><button class="btn primary" '+(mix.length<200?'disabled':'')+' onclick="mixed(200)">Start</button></div></div><div class="card warn"><b>Exam rule:</b> English Part-A has 25% negative marking in the verified 2026 scheme. Do not assume the same penalty for Paper II or III unless TGPRB issues an instruction saying so.</div>'}
window.mixed=function(n){var pool=shuffle(uniqueMixed());begin(pool.slice(0,Math.min(n,pool.length)),true,null)}
function mistakes(){var ids=Object.keys(state.mistakes),rows=ids.map(function(id){var q=bank.find(function(x){return x.id===id});if(!q)return'';return'<tr><td>'+q.paper+'</td><td>'+TN[q.topic]+'</td><td>'+q.text+'</td><td>'+state.mistakes[id].count+'</td><td><button class="btn" onclick="retry(\''+id+'\')">Retry</button></td></tr>'}).join('');document.getElementById('mistakes').innerHTML='<div class="card"><h2>Mistake notebook</h2>'+(rows?'<div style="overflow:auto"><table class="table"><thead><tr><th>Paper</th><th>Topic</th><th>Question</th><th>Wrong</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="mut">No recorded mistakes yet.</p>')+'</div>'}
window.retry=function(id){var q=bank.find(function(x){return x.id===id});if(q)begin([q],false,q.topic)}
function backup(){document.getElementById('backup').innerHTML='<div class="grid"><div class="card"><h3>Export progress</h3><p class="mut">Progress is stored in this browser. Export before switching devices.</p><button class="btn primary" onclick="exp()">Download JSON</button></div><div class="card"><h3>Import progress</h3><input id="imp" type="file" accept="application/json"><p><button class="btn" onclick="imp()">Import</button></p></div><div class="card"><h3>Question provenance</h3><p><b>'+bank.filter(function(q){return q.src==='PYQ'}).length+'</b> source-traceable PYQ-derived questions; <b>'+bank.filter(function(q){return q.src==='MODEL'}).length+'</b> model questions.</p><p class="mut">Exact full previous-paper text is not bulk-copied from third-party transcripts. If you provide an official booklet you possess, it can be imported with exact wording and page/question references.</p></div></div>'}
window.exp=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='asi-fpb-progress.json';a.click();URL.revokeObjectURL(a.href)}
window.imp=function(){var f=document.getElementById('imp').files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{state=Object.assign(defaults(),JSON.parse(r.result));save();alert('Progress imported.');dash()}catch(e){alert('Invalid progress file.')}};r.readAsText(f)}
window.nav=nav;dash();
})();
</script>
</body></html>
