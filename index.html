function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaults()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function nav(id){document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});document.getElementById(id).classList.add('on');document.querySelectorAll('#nav button').forEach(function(x){x.classList.toggle('on',x.dataset.v===id)});render(id)}
var views=[['dashboard','Dashboard'],['learn','Learn'],['practice','Practice'],['exams','Exams'],['mistakes','Mistakes'],['backup','Backup']];
document.getElementById('nav').innerHTML=views.map(function(v){return '<button data-v="'+v[0]+'">'+v[1]+'</button>'}).join('');
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){nav(b.dataset.v)}});
function statsTopic(t){var h=state.history.filter(function(x){return x.topic===t});var c=h.filter(function(x){return x.correct}).length;return{n:h.length,a:h.length?Math.round(c*100/h.length):0}}
function render(id){if(id==='dashboard')dash();if(id==='learn')learn();if(id==='practice'&&!session)practiceHome();if(id==='exams')exams();if(id==='mistakes')mistakes();if(id==='backup')backup()}
function dash(){
 var acc=state.attempted?Math.round(state.correct*100/state.attempted):0,learned=Object.keys(state.learned).length;
 document.getElementById('dashboard').innerHTML='<div class="card hero"><span class="badge ok">2026 ASI FPB pathway</span><h2>Train for recall, speed and accuracy — not chapter completion.</h2><p class="mut">Paper I qualifies you; Paper II + Paper III decide merit. For objective Papers II/III, 200 questions in 180 minutes means 54 sec/question average.</p></div><div class="grid"><div class="card"><div class="mut">Attempted</div><div class="big">'+state.attempted+'</div></div><div class="card"><div class="mut">Accuracy</div><div class="big">'+acc+'%</div></div><div class="card"><div class="mut">Topics studied</div><div class="big">'+learned+'/'+Object.keys(TN).length+'</div></div><div class="card"><div class="mut">Mistakes pending</div><div class="big">'+Object.keys(state.mistakes).length+'</div></div></div><div class="card"><h3>Recommended order</h3><p>1. Learn concept → 2. shortcuts/traps → 3. PYQ-derived practice → 4. model drill → 5. topic test → 6. mixed cumulative test → 7. full-paper simulation.</p></div><div class="card warn"><b>Source discipline:</b> 2023 Paper-II items in this site are source-traceable paraphrases with Booklet-A question numbers. Model questions are never labelled PYQ. The official 2023 Technical answer key is linked, but technical questions are not invented from the key.</div>';
}
function learn(){
 var out='<div class="card"><h2>Official-syllabus topic learning</h2><p class="mut">Open a topic, study the concept + shortcut + trap + pace, then mark it studied. Practice remains available, but mastery should come from later testing.</p></div>';
 papers.forEach(function(p){out+='<div class="card"><h3>'+p.name+'</h3><p class="mut">'+p.note+'</p>';p.topics.forEach(function(t){var st=statsTopic(t[0]);out+='<div class="topic"><div><b>'+t[1]+'</b><div class="mut">'+st.n+' attempts · '+st.a+'% accuracy '+(state.learned[t[0]]?'· studied':'')+'</div></div><div class="row"><button class="btn" onclick="showLesson(\''+t[0]+'\')">Learn</button><button class="btn" onclick="startTopic(\''+t[0]+'\',\'PYQ\')">PYQ</button><button class="btn" onclick="startTopic(\''+t[0]+'\',\'MODEL\')">Model</button></div></div>'});out+='</div>'});
 out+='<div class="card"><h3>Verified source archive</h3><p><a style="color:#86efac" target="_blank" href="https://tslprbpartone.s3.ap-south-1.amazonaws.com/Preliminary_Key_ASI_FPB.pdf">2023 ASI FPB Technical — official preliminary answer key ↗</a></p><p><a style="color:#86efac" target="_blank" href="https://www.tgprb.in/">Current TGPRB official site ↗</a></p></div>';
 document.getElementById('learn').innerHTML=out;
}
window.showLesson=function(t){var L=lessons[t]||fallbackLesson(t);document.getElementById('learn').innerHTML='<button class="btn" onclick="render(\'learn\')">← All topics</button><div class="card hero"><span class="badge">'+TP[t]+'</span><h2>'+TN[t]+'</h2><div class="lesson"><div><b>Learn</b><p>'+L[0]+'</p></div><div><b>Shortcut / exam method</b><p>'+L[1]+'</p></div><div><b>Trap to avoid</b><p>'+L[2]+'</p></div><div><b>Time target</b><p>'+L[3]+'</p></div></div><div class="row"><button class="btn primary" onclick="markLearned(\''+t+'\')">'+(state.learned[t]?'Studied ✓':'Mark studied')+'</button><button class="btn" onclick="startTopic(\''+t+'\',\'PYQ\')">Previous questions</button><button class="btn" onclick="startTopic(\''+t+'\',\'MODEL\')">Model drill</button></div></div>'};
window.markLearned=function(t){state.learned[t]=true;save();showLesson(t)}
function topicOptions(){return papers.map(function(p){return '<optgroup label="'+p.name+'">'+p.topics.map(function(t){return '<option value="'+t[0]+'">'+t[1]+'</option>'}).join('')+'</optgroup>'}).join('')}
function practiceHome(){document.getElementById('practice').innerHTML='<div class="card"><h2>Practice</h2><div class="controls"><label>Topic<select id="pt">'+topicOptions()+'</select></label><label>Source<select id="ps"><option value="ALL">All</option><option value="PYQ">PYQ-derived</option><option value="MODEL">Model</option></select></label><label>Questions<input id="pc" type="number" min="1" max="50" value="10"></label></div><p><button class="btn primary" onclick="practiceGo()">Start practice</button></p></div>'}
window.practiceGo=function(){var t=document.getElementById('pt').value,s=document.getElementById('ps').value,c=+document.getElementById('pc').value;start(t,s,c)}
window.startTopic=function(t,s){start(t,s,10)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),z=a[i];a[i]=a[j];a[j]=z}return a}
function start(t,s,c){var pool=bank.filter(function(q){return q.topic===t&&(s==='ALL'||q.src===s)});if(!pool.length){alert(s==='PYQ'?'No source-traceable PYQ is loaded for this topic yet. Use model drill, but keep the source distinction clear.':'No questions loaded.');return}begin(shuffle(pool).slice(0,Math.min(c||10,pool.length)),false,t)}
function begin(qs,timed,topic){session={qs:qs,i:0,score:0,answered:false,timed:timed,topic:topic,seconds:timed?Math.round(qs.length*54):0};nav('practice');question();if(timer)clearInterval(timer);if(timed)timer=setInterval(function(){session.seconds--;tick();if(session.seconds<=0)finish()},1000)}
function question(){var q=session.qs[session.i],src=q.src==='PYQ'?'<span class="badge pyq">2023 PYQ-derived</span>':'<span class="badge model">Model</span>',meta=q.src==='PYQ'?'<div class="source"><b>2023 · Booklet '+q.meta.booklet+' · original Q'+q.meta.qno+'</b><br>'+q.meta.wording+' · <a target="_blank" href="'+q.meta.url+'">source ↗</a></div>':'';document.getElementById('practice').innerHTML='<div class="card"><div class="row spread"><span class="badge">'+q.paper+' · '+TN[q.topic]+'</span><span>'+(session.i+1)+'/'+session.qs.length+' <b id="tm"></b></span></div><div class="progress"><i style="width:'+(session.i/session.qs.length*100)+'%"></i></div><div class="row" style="margin-top:14px">'+src+'</div>'+meta+'<div class="q">'+q.text+'</div><div id="opts">'+q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>'}).join('')+'</div><div id="fb"></div><div class="row spread" style="margin-top:12px"><button class="btn" onclick="finish()">End</button><button id="nx" class="btn primary hidden" onclick="next()">Next</button></div></div>';tick()}
window.answer=function(i){if(session.answered)return;session.answered=true;var q=session.qs[session.i],ok=i===q.ans;if(ok)session.score++;state.attempted++;if(ok)state.correct++;state.history.push({id:q.id,topic:q.topic,correct:ok,ts:Date.now()});if(!ok){var m=state.mistakes[q.id]||{count:0};m.count++;m.last=Date.now();state.mistakes[q.id]=m}else if(state.mistakes[q.id]&&state.mistakes[q.id].count<=1)delete state.mistakes[q.id];save();document.querySelectorAll('.opt').forEach(function(b){var x=+b.dataset.i;b.disabled=true;if(x===q.ans)b.classList.add('correct');if(x===i&&!ok)b.classList.add('wrong')});var f=document.getElementById('fb');f.className='feedback';f.innerHTML='<b>'+(ok?'Correct.':'Incorrect.')+'</b> '+q.why;document.getElementById('nx').classList.remove('hidden')}
window.next=function(){if(session.i+1>=session.qs.length)finish();else{session.i++;question()}}
function tick(){var e=document.getElementById('tm');if(e&&session&&session.timed){var s=session.seconds;e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}
window.finish=finish;function finish(){if(!session)return;if(timer)clearInterval(timer);var sc=Math.round(session.score*100/session.qs.length);if(session.topic)state.topicBest[session.topic]=Math.max(state.topicBest[session.topic]||0,sc);save();document.getElementById('practice').innerHTML='<div class="card"><h2>Session complete</h2><div class="big">'+sc+'%</div><p>'+session.score+' / '+session.qs.length+' correct.</p><p class="mut">'+(sc>=80?'Strong. Retest later to prove retention.':sc>=60?'Review errors before moving on.':'Return to the learning module, then retry a shorter drill.')+'</p><div class="row"><button class="btn primary" onclick="nav(\'dashboard\')">Dashboard</button><button class="btn" onclick="nav(\'mistakes\')">Mistakes</button></div></div>';session=null}
function exams(){var p2=bank.filter(function(q){return q.paper==='P2'}),p3=bank.filter(function(q){return q.paper==='P3'}),mix=p2.concat(p3);document.getElementById('exams').innerHTML='<div class="card"><h2>Exam ladder</h2><p class="mut">Do cumulative testing before syllabus completion. Full strict 200-question simulation unlocks only when at least 200 unique questions exist in that pool.</p></div><div class="grid"><div class="card"><h3>20Q topic/mixed sprint</h3><p>Short accuracy + pace check.</p><button class="btn primary" onclick="mixed(20)">Start</button></div><div class="card"><h3>50Q cumulative</h3><p>Mixed Paper II + III.</p><button class="btn primary" onclick="mixed(50)">Start</button></div><div class="card"><h3>100Q cumulative</h3><p>Timed at 54 sec/question.</p><button class="btn primary" onclick="mixed(100)">Start</button></div><div class="card"><h3>200Q strict mock</h3><p>'+mix.length+' unique questions currently available in hosted bank.</p><button class="btn primary" '+(mix.length<200?'disabled':'')+' onclick="mixed(200)">Start</button></div></div><div class="card warn"><b>Exam rule:</b> English Part-A has 25% negative marking in the verified 2026 scheme. Do not assume the same penalty for Paper II or III unless TGPRB issues an instruction saying so.</div>'}
window.mixed=function(n){var pool=shuffle(bank.filter(function(q){return q.paper==='P2'||q.paper==='P3'}));begin(pool.slice(0,Math.min(n,pool.length)),true,null)}
function mistakes(){var ids=Object.keys(state.mistakes),rows=ids.map(function(id){var q=bank.find(function(x){return x.id===id});if(!q)return'';return'<tr><td>'+q.paper+'</td><td>'+TN[q.topic]+'</td><td>'+q.text+'</td><td>'+state.mistakes[id].count+'</td><td><button class="btn" onclick="retry(\''+id+'\')">Retry</button></td></tr>'}).join('');document.getElementById('mistakes').innerHTML='<div class="card"><h2>Mistake notebook</h2>'+(rows?'<div style="overflow:auto"><table class="table"><thead><tr><th>Paper</th><th>Topic</th><th>Question</th><th>Wrong</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="mut">No recorded mistakes yet.</p>')+'</div>'}
window.retry=function(id){var q=bank.find(function(x){return x.id===id});if(q)begin([q],false,q.topic)}
function backup(){document.getElementById('backup').innerHTML='<div class="grid"><div class="card"><h3>Export progress</h3><p class="mut">Progress is stored in this browser. Export before switching devices.</p><button class="btn primary" onclick="exp()">Download JSON</button></div><div class="card"><h3>Import progress</h3><input id="imp" type="file" accept="application/json"><p><button class="btn" onclick="imp()">Import</button></p></div><div class="card"><h3>Question provenance</h3><p><b>'+bank.filter(function(q){return q.src==='PYQ'}).length+'</b> source-traceable PYQ-derived questions; <b>'+bank.filter(function(q){return q.src==='MODEL'}).length+'</b> model questions.</p><p class="mut">Exact full previous-paper text is not bulk-copied from third-party transcripts. If you provide an official booklet you possess, it can be imported with exact wording and page/question references.</p></div></div>'}
window.exp=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='asi-fpb-progress.json';a.click();URL.revokeObjectURL(a.href)}
window.imp=function(){var f=document.getElementById('imp').files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{state=Object.assign(defaults(),JSON.parse(r.result));save();alert('Progress imported.');dash()}catch(e){alert('Invalid progress file.')}};r.readAsText(f)}
window.nav=nav;dash();
})();
</script>
</body></html>
